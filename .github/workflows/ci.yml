name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-android-build:
        description: Skip the throwaway-key Android build (the caller builds signed APKs itself).
        type: boolean
        default: false
      skip-desktop-builds:
        description: Skip the Linux and Windows release builds (the caller builds and packages them itself).
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Format, analyze & codegen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        id: setup
        uses: ./.github/actions/setup-flutter
      - name: Check formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Analyze
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: flutter analyze --no-pub
      - name: Check ARB metadata
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: dart run tool/check_arb.dart
      - name: Check generated code is committed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          changes="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            git --no-pager diff --stat
            echo "::error::Generated files differ from the commit. Run 'flutter pub get', 'flutter gen-l10n' and 'dart run build_runner build --delete-conflicting-outputs', then commit the result."
            exit 1
          fi

  test-shards:
    name: Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shard-total: ${{ strategy.job-total }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Run tests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          mapfile -d '' -t test_files < <(git ls-files -z -- 'test/*_test.dart')
          shard_files=()
          for i in "${!test_files[@]}"; do
            if (( i % SHARD_TOTAL == SHARD_INDEX )); then
              shard_files+=("${test_files[$i]}")
            fi
          done
          if (( ${#shard_files[@]} == 0 )); then
            echo '::error::Test shard is empty; check the shard configuration.'
            exit 1
          fi
          echo "Shard $((SHARD_INDEX + 1))/$SHARD_TOTAL: ${#shard_files[@]} of ${#test_files[@]} test files"
          flutter test --no-pub --coverage "${shard_files[@]}"
      - name: Upload shard coverage
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 1

  test:
    name: Tests
    needs: test-shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check all test shards passed
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: |
          if [[ "$SHARD_RESULT" != 'success' ]]; then
            echo "::error::Test shards finished with result: $SHARD_RESULT"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Download shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-lcov-shard-*
          path: coverage/shards
      - name: Merge coverage
        env:
          SHARD_TOTAL: ${{ needs.test-shards.outputs.shard-total }}
        run: |
          shopt -s nullglob
          coverage_files=(coverage/shards/*/lcov.info)
          if (( ${#coverage_files[@]} != SHARD_TOTAL )); then
            echo "::error::Expected $SHARD_TOTAL coverage reports, found ${#coverage_files[@]}."
            exit 1
          fi
          dart run tool/merge_lcov.dart coverage/lcov.info "${coverage_files[@]}"
      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        run: |
          awk -F: '
            /^SF:/ { generated = ($2 ~ /\.g\.dart$/ || $2 ~ /\/l10n\/app_localizations_gen/) }
            /^LF:/ && !generated { found += $2 }
            /^LH:/ && !generated { hit += $2 }
            END {
              if (found > 0) {
                printf "### Test coverage\n\nLine coverage: **%.1f%%** (%d / %d lines, generated code excluded)\n", hit * 100 / found, hit, found
              }
            }
          ' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  android:
    name: Android release build
    if: ${{ !inputs.skip-android-build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_STORAGE_BASE_URL: "https://storage.flutter-io.cn"
      PUB_HOSTED_URL: "https://pub.flutter-io.cn"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java: 'true'
      - name: Create throwaway signing key
        run: |
          password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -alias ci -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Jotsy CI throwaway key' -keystore android/ci-throwaway.jks \
            -storepass "$password" -keypass "$password"
          {
            printf 'storePassword=%s\n' "$password"
            printf 'keyPassword=%s\n' "$password"
            printf 'keyAlias=ci\n'
            printf 'storeFile=ci-throwaway.jks\n'
          } > android/key.properties
      - name: Build release APK (arm64) 重试3次
        run: |
          set -e
          for i in {1..3}; do
            echo "==== 第 $i 次尝试编译安卓 ===="
            flutter build apk --release --target-platform android-arm64 && exit 0
            sleep 20
          done
          exit 1
      - name: Cache Robolectric Android jars
        uses: ./.github/actions/main-cache
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts', 'android/app/src/test/**') }}
      - name: Test Android picker permissions and result handling
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Report APK size
        run: |
          stat --format=%s build/app/outputs/flutter-apk/app-release.apk |
            awk '{ printf "### Android build\n\napp-release.apk (arm64-v8a): %.1f MiB\n", $1 / 1048576 }' \
            >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux release build
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Build Linux release bundle
        run: flutter build linux --release
      - name: Report bundle size
        run: |
          du -sb build/linux/x64/release/bundle |
            awk '{ printf "### Linux build\n\nbundle/: %.1f MiB\n", $1 / 1048576 }' \
            >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows release build
    if: false
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Build Windows release
        run: flutter build windows --release
      - name: Report build size
        shell: bash
        run: |
          du -sb build/windows/x64/runner/Release |
            awk '{ printf "### Windows build\n\nRelease/: %.1f MiB\n", $1 / 1048576 }' \
            >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache actionlint
        id: actionlint-cache
        uses: ./.github/actions/main-cache
        with:
          path: ~/.cache/actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-linux-amd64
      - name: Download actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL --connect-timeout 10 --max-time 30 --retry 10 --retry-all-errors \
            --retry-delay 5 --retry-max-time 180 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p ~/.cache/actionlint
          tar -xzf "$archive" -C ~/.cache/actionlint actionlint
      - name: Run actionlint
        run: ~/.cache/actionlint/actionlint -color

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|refactor|perf|docs|test|build|ci|chore|style|revert)(\([^)]+\))?!?: [^ ].*'
          failed=0
          checked=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            checked=$((checked + 1))
            if [[ ! "$subject" =~ $pattern && ! "$subject" =~ ^Revert\ \" ]]; then
              echo "::error title=Commit message::${sha:0:7} is not a Conventional Commit: ${subject//%/%25}"
              failed=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE_SHA..$HEAD_SHA")
          if [[ "$failed" == 1 ]]; then
            echo "Use '<type>(<scope>): <summary>' with type feat, fix, refactor, perf, docs, test, build, ci, chore, style or revert (AGENTS.md §9)."
            exit 1
          fi
          echo "Checked $checked commit(s)."
